[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentilyzer-ml"
version = "0.1.0"
description = "Sentilyzer ML inference worker (gRPC, HuggingFace Transformers)."
authors = [{ name = "Chijioke Ekechi" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.27",
    "numpy>=1.26",
    # Cap below 5: transformers 5 changed from_pretrained's dtype default to
    # "auto", which can silently load fp16/bf16 weights — wrong/slow on CPU and
    # it corrupts the soft labels a distilled student trains on. inference.py
    # also passes torch_dtype=torch.float32 explicitly as a belt-and-suspenders.
    "transformers>=4.45,<5",
    "tokenizers>=0.20",
    "torch>=2.4",
    "scipy>=1.11",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Serving the distilled INT8 student (OnnxBackend + the R2 model store).
serve = [
    "onnxruntime>=1.18",
    "boto3>=1.34",
]
# Training-pipeline stages (prep/label/distill/export); serving installs
# don't need any of it. torch/transformers come from the base dependencies.
pipeline = [
    "duckdb>=1.0",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "boto3>=1.34",
    "modal>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
sentilyzer-ml = "sentilyzer_ml.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentilyzer_ml*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

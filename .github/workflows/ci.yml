name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: api/go.sum

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Go stubs
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p api/gen/go
          protoc -I proto \
            --go_out=api/gen/go --go_opt=paths=source_relative \
            --go-grpc_out=api/gen/go --go-grpc_opt=paths=source_relative \
            proto/sentilyzer/v1/sentilyzer.proto proto/sentilyzer/v1/inference.proto

      - run: go vet ./...
      - run: go test ./... -race -count=1

  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install grpcio-tools
          mkdir -p sentilyzer_ml/gen
          python -m grpc_tools.protoc \
            -I ../proto \
            --python_out=sentilyzer_ml/gen \
            --grpc_python_out=sentilyzer_ml/gen \
            ../proto/sentilyzer/v1/sentilyzer.proto ../proto/sentilyzer/v1/inference.proto
          # Install only the dev/runtime deps we actually need for tests —
          # skip torch/transformers since stub mode covers what we test in CI.
          pip install grpcio numpy structlog pytest ruff

      - name: Lint
        run: ruff check sentilyzer_ml tests

      - name: Test
        env:
          SENTILYZER_ML_USE_STUB: "1"
        run: python -m pytest tests -q

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f deploy/docker/api.Dockerfile -t sentilyzer/api:ci .
      - name: Build ML image (stub-friendly)
        run: docker build -f deploy/docker/ml.Dockerfile -t sentilyzer/ml:ci .
